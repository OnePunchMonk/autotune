[project]
name = "autotune"
version = "0.1.0"
description = "An agentic post-training system: describe a business use case, feed it mock data, and Autotune plans a recipe, synthesizes the rest of the dataset, fine-tunes with Unsloth+PEFT on Modal, evaluates, loops, and deploys."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "modal>=0.65.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "datasets>=2.19.0",
    "pyyaml>=6.0.1",
    "huggingface_hub>=0.24.0",
]

[project.scripts]
autotune = "autotune.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autotune"]
